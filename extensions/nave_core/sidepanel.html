<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nave Barra Lateral de Guias</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="sidepanel.css">
</head>
<body>

  <!-- Topo: Branding e Nova Guia -->
  <header class="sidebar-header">
    <div class="brand-wrapper">
      <img src="icons/nave.svg" alt="Nave Logo" class="brand-logo" />
      <span class="brand-title">Nave</span>
    </div>

    <div class="header-actions">
      <button id="btnCleanDuplicates" class="btn-icon-action" title="Limpar guias duplicadas">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <polyline points="3 6 5 6 21 6"></polyline>
          <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
        </svg>
      </button>

      <button id="btnNewTabHeader" class="btn-new-tab-header" title="Nova Guia (Ctrl+T)">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
          <line x1="12" y1="5" x2="12" y2="19"></line>
          <line x1="5" y1="12" x2="19" y2="12"></line>
        </svg>
        <span>Nova Guia</span>
      </button>
    </div>
  </header>

  <!-- Seletor de Modo: Guias vs Hub -->
  <div class="view-toggle">
    <button id="btnToggleTabs" class="toggle-tab active">Guias Verticais</button>
    <button id="btnToggleHub" class="toggle-tab">Hub OZATI</button>
  </div>

  <!-- Barra de Busca Rápida -->
  <div class="search-container">
    <div class="search-box">
      <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <circle cx="11" cy="11" r="8"></circle>
        <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
      </svg>
      <input type="text" id="tabSearch" class="search-input" placeholder="Pesquisar guias abertas..." autocomplete="off" />
    </div>
  </div>

  <!-- Conteúdo Principal com Scroll -->
  <main class="panel-content">

    <!-- MODO 1: GUIAS VERTICAIS -->
    <div id="tabsContainer" style="display: flex; flex-direction: column; gap: 12px; flex: 1;">
      
      <!-- Seção Fixadas -->
      <section id="pinnedSection" class="section-wrapper" style="display: none;">
        <div class="section-header">
          <span class="section-label">Fixadas</span>
        </div>
        <div id="pinnedGrid" class="pinned-grid"></div>
      </section>

      <!-- Seção Abertas -->
      <section class="section-wrapper" style="flex: 1;">
        <div class="section-header">
          <span class="section-label">Abertas</span>
          <span id="tabsCountBadge" class="badge-count">0</span>
        </div>
        <div id="tabsList" class="tabs-list">
          <!-- Injetado via JS -->
        </div>
      </section>

    </div>

    <!-- MODO 2: HUB OZATI (Apps + Notas Rápidas) -->
    <div id="hubContainer" class="hub-view" style="display: none;">
      
      <div class="section-wrapper">
        <div class="section-header">
          <span class="section-label">Acesso Rápido</span>
        </div>
        <div class="apps-grid">
          <a href="https://www.google.com" target="_blank" class="app-card">
            <div class="app-icon">
              <svg viewBox="0 0 24 24" width="14" height="14"><path fill="#4285F4" d="M23.745 12.27c0-.7-.06-1.4-.19-2.07H12v4.51h6.6c-.29 1.52-1.14 2.8-2.4 3.65v3h3.88c2.27-2.09 3.66-5.17 3.66-9.09z"/><path fill="#34A853" d="M12 24c3.24 0 5.95-1.08 7.93-2.91l-3.88-3c-1.08.72-2.45 1.16-4.05 1.16-3.12 0-5.77-2.1-6.72-4.93H1.25v3.1C3.28 21.43 7.37 24 12 24z"/><path fill="#FBBC05" d="M5.28 14.32c-.25-.72-.38-1.49-.38-2.32s.13-1.6.38-2.32V6.58H1.25C.45 8.17 0 9.97 0 12s.45 3.83 1.25 5.42l4.03-3.1z"/><path fill="#EA4335" d="M12 4.75c1.77 0 3.35.61 4.6 1.8l3.42-3.42C17.95 1.19 15.24 0 12 0 7.37 0 3.28 2.57 1.25 6.58l4.03 3.1c.95-2.83 3.6-4.93 6.72-4.93z"/></svg>
            </div>
            <div class="app-name">Google</div>
          </a>

          <a href="https://gemini.google.com" target="_blank" class="app-card">
            <div class="app-icon">
              <svg viewBox="0 0 24 24" width="14" height="14" fill="#fff"><path d="M12 2L9.5 9.5 2 12l7.5 2.5L12 22l2.5-7.5L22 12l-7.5-2.5z"/></svg>
            </div>
            <div class="app-name">Gemini</div>
          </a>

          <a href="https://chatgpt.com" target="_blank" class="app-card">
            <div class="app-icon">
              <svg viewBox="0 0 24 24" width="14" height="14" fill="#fff"><path d="M22.28 9.9a5.98 5.98 0 0 0-.48-4.68 6.04 6.04 0 0 0-6.62-2.73A6 6 0 0 0 10.4 1a6.04 6.04 0 0 0-5.74 4.19 6 6 0 0 0-4.14 3 6.04 6.04 0 0 0 .74 7.15 5.98 5.98 0 0 0 .48 4.68 6.04 6.04 0 0 0 6.62 2.73A6 6 0 0 0 13.6 23a6.04 6.04 0 0 0 5.74-4.19 6 6 0 0 0 4.14-3 6.04 6.04 0 0 0-.74-7.15z"/></svg>
            </div>
            <div class="app-name">ChatGPT</div>
          </a>

          <a href="https://github.com" target="_blank" class="app-card">
            <div class="app-icon">
              <svg viewBox="0 0 24 24" width="14" height="14" fill="#fff"><path d="M12 0C5.37 0 0 5.37 0 12c0 5.31 3.435 9.795 8.205 11.385.6.105.825-.255.825-.57 0-.285-.015-1.23-.015-2.235-3.015.555-3.795-.735-4.035-1.41-.135-.345-.72-1.41-1.23-1.695-.42-.225-1.02-.78-.015-.795.945-.015 1.62.87 1.845 1.23 1.08 1.815 2.805 1.305 3.495.99.105-.78.42-1.305.765-1.605-2.67-.3-5.46-1.335-5.46-5.925 0-1.305.465-2.385 1.23-3.225-.12-.3-.54-1.53.12-3.18 0 0 1.005-.315 3.3 1.23.96-.27 1.98-.405 3-.405s2.04.135 3 .405c2.295-1.56 3.3-1.23 3.3-1.23.66 1.65.24 2.88.12 3.18.765.84 1.23 1.905 1.23 3.225 0 4.605-2.805 5.625-5.475 5.925.435.375.81 1.095.81 2.22 0 1.605-.015 2.895-.015 3.3 0 .315.225.69.825.57A12.02 12.02 0 0 0 24 12c0-6.63-5.37-12-12-12z"/></svg>
            </div>
            <div class="app-name">GitHub</div>
          </a>
        </div>
      </div>

      <!-- Bloco de Notas Local -->
      <div class="notepad-card">
        <div class="section-header">
          <span class="section-label">Bloco de Notas Local</span>
        </div>
        <textarea id="quickNotes" class="notepad-textarea" placeholder="Rascunhos temporários salvos no seu disco..."></textarea>
        <div class="notepad-footer">
          <span>Local-First</span>
          <span id="noteCharCount">0 carac.</span>
        </div>
      </div>

    </div>

  </main>

  <!-- Rodapé Fixo -->
  <footer class="sidebar-footer">
    <span class="footer-version">Nave v1.0.2</span>
    <button id="btnPinSidebar" class="footer-btn" title="Fixar barra lateral">
      OZATI Core
    </button>
  </footer>

  <script src="sidepanel.js"></script>
</body>
</html>
