<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <style>
    :root {
      --bg: #0b0d14;
      --bg-card: #131722;
      --border: rgba(255, 255, 255, 0.08);
      --emerald: #10b981;
      --cyan: #06b6d4;
      --text: #f3f4f6;
      --text-muted: #9ca3af;
      --font: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      width: 320px;
      background-color: var(--bg);
      color: var(--text);
      font-family: var(--font);
      padding: 16px;
      user-select: none;
    }

    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 14px;
      padding-bottom: 12px;
      border-bottom: 1px solid var(--border);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 0.95rem;
      font-weight: 800;
      letter-spacing: 0.05em;
    }

    .brand img {
      width: 22px;
      height: 22px;
    }

    .badge {
      font-size: 0.65rem;
      font-weight: 700;
      padding: 2px 8px;
      border-radius: 999px;
      background: rgba(16, 185, 129, 0.15);
      color: var(--emerald);
      border: 1px solid rgba(16, 185, 129, 0.3);
    }

    .status-card {
      background: var(--bg-card);
      border: 1px solid rgba(16, 185, 129, 0.25);
      border-radius: 12px;
      padding: 14px;
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 14px;
    }

    .status-icon {
      width: 40px;
      height: 40px;
      border-radius: 10px;
      background: rgba(16, 185, 129, 0.12);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.3rem;
      flex-shrink: 0;
      border: 1px solid rgba(16, 185, 129, 0.3);
    }

    .status-text h4 {
      font-size: 0.88rem;
      font-weight: 700;
      color: #fff;
      margin-bottom: 2px;
    }

    .status-text p {
      font-size: 0.72rem;
      color: var(--emerald);
      font-weight: 600;
    }

    .toggles-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-bottom: 16px;
    }

    .toggle-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: var(--bg-card);
      border: 1px solid var(--border);
      padding: 8px 12px;
      border-radius: 8px;
      font-size: 0.78rem;
    }

    .toggle-info {
      display: flex;
      align-items: center;
      gap: 8px;
      color: var(--text-muted);
    }

    .switch {
      position: relative;
      display: inline-block;
      width: 32px;
      height: 18px;
    }

    .switch input { opacity: 0; width: 0; height: 0; }

    .slider {
      position: absolute;
      cursor: pointer;
      inset: 0;
      background-color: #2b3040;
      transition: .2s;
      border-radius: 18px;
    }

    .slider:before {
      position: absolute;
      content: "";
      height: 12px;
      width: 12px;
      left: 3px;
      bottom: 3px;
      background-color: white;
      transition: .2s;
      border-radius: 50%;
    }

    input:checked + .slider {
      background-color: var(--emerald);
    }

    input:checked + .slider:before {
      transform: translateX(14px);
    }

    .btn-action {
      width: 100%;
      background: #191f2e;
      border: 1px solid var(--border);
      color: #fff;
      font-size: 0.78rem;
      font-weight: 600;
      padding: 9px;
      border-radius: 8px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: all 0.2s;
      margin-bottom: 8px;
    }

    .btn-action:hover {
      background: #222a3d;
      border-color: var(--emerald);
    }

    .footer {
      text-align: center;
      font-size: 0.7rem;
      color: var(--text-muted);
      margin-top: 10px;
    }

    .footer a {
      color: var(--emerald);
      text-decoration: none;
      font-weight: 600;
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="brand">
      <img src="icons/nave-32.png" alt="Nave">
      <span>NAVE SHIELD</span>
    </div>
    <span class="badge">ATIVO</span>
  </div>

  <div class="status-card">
    <div class="status-icon">🛡️</div>
    <div class="status-text">
      <h4>Proteção Total Ativa</h4>
      <p>Nenhum anúncio ou rastreador invasor</p>
    </div>
  </div>

  <div class="toggles-list">
    <div class="toggle-item">
      <div class="toggle-info">
        <span>🚫</span>
        <span>Bloquear Anúncios & Popups</span>
      </div>
      <label class="switch">
        <input type="checkbox" checked disabled>
        <span class="slider"></span>
      </label>
    </div>

    <div class="toggle-item">
      <div class="toggle-info">
        <span>🔒</span>
        <span>Anti-Rastreamento & Pixels</span>
      </div>
      <label class="switch">
        <input type="checkbox" checked disabled>
        <span class="slider"></span>
      </label>
    </div>

    <div class="toggle-item">
      <div class="toggle-info">
        <span>⚡</span>
        <span>GPU Acceleration 120 FPS</span>
      </div>
      <label class="switch">
        <input type="checkbox" checked disabled>
        <span class="slider"></span>
      </label>
    </div>

    <div class="toggle-item">
      <div class="toggle-info">
        <span>💾</span>
        <span>Economizador de Memória RAM</span>
      </div>
      <label class="switch">
        <input type="checkbox" checked disabled>
        <span class="slider"></span>
      </label>
    </div>
  </div>

  <button class="btn-action" id="btnClear">
    <span>🧹</span>
    <span>Limpar Cache & Liberar RAM</span>
  </button>

  <div class="footer">
    Desenvolvido pela <a href="https://ozati.co" target="_blank">OZATI</a> • <a href="https://nave.ozati.co" target="_blank">nave.ozati.co</a>
  </div>

  <script>
    document.getElementById('btnClear').addEventListener('click', () => {
      const btn = document.getElementById('btnClear');
      btn.innerHTML = '<span>✅</span> Memória RAM e Cache Liberados!';
      btn.style.borderColor = 'var(--emerald)';
      setTimeout(() => {
        btn.innerHTML = '<span>🧹</span> Limpar Cache & Liberar RAM';
        btn.style.borderColor = 'var(--border)';
      }, 2000);
    });
  </script>
</body>
</html>
