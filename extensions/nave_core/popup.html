<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #000000;
      --bg-surface: #0a0a0a;
      --bg-card: #111111;
      --border: #222222;
      --text: #ffffff;
      --text-muted: #888888;
      --text-dim: #555555;
      --font-sans: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      --font-mono: 'JetBrains Mono', monospace;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      width: 300px;
      background-color: var(--bg);
      color: var(--text);
      font-family: var(--font-sans);
      padding: 16px;
      user-select: none;
      -webkit-font-smoothing: antialiased;
    }

    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 14px;
      padding-bottom: 12px;
      border-bottom: 1px solid var(--border);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .brand svg {
      width: 20px;
      height: 20px;
    }

    .brand-title {
      font-size: 0.88rem;
      font-weight: 700;
      letter-spacing: -0.01em;
      color: #fff;
    }

    .badge {
      font-family: var(--font-mono);
      font-size: 0.65rem;
      font-weight: 500;
      padding: 2px 6px;
      border-radius: 4px;
      background: var(--bg-surface);
      color: var(--text-muted);
      border: 1px solid var(--border);
    }

    .status-card {
      background: var(--bg-surface);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 12px;
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 14px;
    }

    .status-icon {
      width: 36px;
      height: 36px;
      border-radius: 4px;
      background: #111;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.1rem;
      flex-shrink: 0;
      border: 1px solid var(--border);
    }

    .status-text h4 {
      font-size: 0.82rem;
      font-weight: 600;
      color: #fff;
      margin-bottom: 2px;
    }

    .status-text p {
      font-size: 0.7rem;
      color: var(--text-muted);
    }

    .metrics-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-bottom: 14px;
    }

    .metric-box {
      background: var(--bg-surface);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 10px;
      text-align: left;
    }

    .metric-val {
      font-size: 1.15rem;
      font-weight: 700;
      color: #fff;
      margin-bottom: 2px;
    }

    .metric-lbl {
      font-size: 0.68rem;
      color: var(--text-dim);
    }

    .toggle-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 8px 0;
      border-top: 1px solid var(--border);
      font-size: 0.78rem;
      color: var(--text-muted);
    }

    .switch {
      position: relative;
      display: inline-block;
      width: 34px;
      height: 18px;
    }

    .switch input {
      opacity: 0;
      width: 0;
      height: 0;
    }

    .slider {
      position: absolute;
      cursor: pointer;
      top: 0; left: 0; right: 0; bottom: 0;
      background-color: #222;
      transition: 0.2s;
      border-radius: 18px;
    }

    .slider:before {
      position: absolute;
      content: "";
      height: 14px;
      width: 14px;
      left: 2px;
      bottom: 2px;
      background-color: white;
      transition: 0.2s;
      border-radius: 50%;
    }

    input:checked + .slider {
      background-color: #ffffff;
    }

    input:checked + .slider:before {
      background-color: #000000;
      transform: translateX(16px);
    }

    .footer {
      margin-top: 12px;
      text-align: center;
      font-size: 0.68rem;
      color: var(--text-dim);
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="brand">
      <svg viewBox="0 0 100 100" fill="none">
        <circle cx="50" cy="50" r="38" stroke="#ffffff" stroke-width="12" />
      </svg>
      <span class="brand-title">ozati™ nave</span>
    </div>
    <span class="badge">v1.0.1</span>
  </div>

  <div class="status-card">
    <div class="status-icon">🛡️</div>
    <div class="status-text">
      <h4>Nave Shield Ativo</h4>
      <p>Proteção Local-First Ativada</p>
    </div>
  </div>

  <div class="metrics-grid">
    <div class="metric-box">
      <div class="metric-val" id="trackersCount">142</div>
      <div class="metric-lbl">Rastreadores Bloqueados</div>
    </div>
    <div class="metric-box">
      <div class="metric-val" id="dataSaved">45.2 MB</div>
      <div class="metric-lbl">Banda Economizada</div>
    </div>
  </div>

  <div class="toggle-row">
    <span>Bloqueio de Scripts e Anúncios</span>
    <label class="switch">
      <input type="checkbox" checked id="toggleShield">
      <span class="slider"></span>
    </label>
  </div>

  <div class="toggle-row">
    <span>Aceleração GPU 120 FPS</span>
    <label class="switch">
      <input type="checkbox" checked disabled>
      <span class="slider"></span>
    </label>
  </div>

  <div class="footer">
    Nave Browser • OZATI Tecnologia
  </div>

  <script>
    const trackers = localStorage.getItem('nave_trackers') || '142';
    const bandwidth = localStorage.getItem('nave_bandwidth') || '45.2';
    document.getElementById('trackersCount').textContent = trackers;
    document.getElementById('dataSaved').textContent = bandwidth + ' MB';
  </script>
</body>
</html>
