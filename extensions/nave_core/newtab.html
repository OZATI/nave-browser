<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nave</title>
  <link rel="icon" type="image/png" href="icons/nave-32.png">
  
  <!-- Tipografia Oficial OZATI: Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg: #000000;
      --bg-surface: #0a0a0a;
      --bg-card: #111111;
      --border: #222222;
      --border-subtle: #181818;
      --border-hover: #444444;
      --text: #ffffff;
      --text-muted: #888888;
      --text-dim: #555555;
      --font-sans: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      --font-mono: 'JetBrains Mono', monospace;

      /* Tokens Figma #5153:254 */
      --glass-bg: rgba(28, 28, 28, 0.64);
      --glass-border: rgba(255, 255, 255, 0.12);
      --glass-shadow: 0px 8px 20px 16px rgba(255, 255, 255, 0.04);
      --topbar-radius: 42px;
      --dock-radius: 46px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      font-family: var(--font-sans);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      user-select: none;
      padding: 24px 36px 36px;
      overflow-x: hidden;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    /* Zona Sensível de Borda Superior (Hover Trigger) */
    .top-hover-zone {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 28px;
      z-index: 9999;
      cursor: default;
    }

    /* Indicador sutil de toque na borda superior */
    .top-edge-hint {
      position: fixed;
      top: 4px;
      left: 50%;
      transform: translateX(-50%);
      width: 42px;
      height: 3px;
      border-radius: 3px;
      background: rgba(255, 255, 255, 0.2);
      z-index: 9998;
      transition: opacity 0.25s ease, transform 0.25s ease;
      pointer-events: none;
    }

    /* Barra Superior Flutuante (Figma #5153:263) */
    header.floating-top-bar {
      position: fixed;
      top: 16px;
      left: 50%;
      transform: translate(-50%, -140%);
      opacity: 0;
      pointer-events: none;
      width: min(1300px, calc(100vw - 48px));
      height: 56px;
      background: var(--glass-bg);
      backdrop-filter: blur(28px);
      -webkit-backdrop-filter: blur(28px);
      border-radius: var(--topbar-radius);
      border: 1px solid var(--glass-border);
      box-shadow: 0 12px 32px rgba(0, 0, 0, 0.7), var(--glass-shadow);
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 24px;
      z-index: 10000;
      transition: transform 0.38s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.3s ease;
    }

    /* Estado Ativo: Visível ao colocar o mouse na borda */
    header.floating-top-bar.visible {
      transform: translate(-50%, 0);
      opacity: 1;
      pointer-events: auto;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      text-decoration: none;
      color: inherit;
    }

    .brand svg {
      width: 24px;
      height: 24px;
    }

    .brand-title {
      font-size: 0.95rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      color: #fff;
    }

    .brand-sub {
      font-family: var(--font-mono);
      font-size: 0.78rem;
      color: var(--text-muted);
      margin-left: 4px;
    }

    .shield-badge {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 0.75rem;
      font-family: var(--font-mono);
      color: #00ff88;
      background: rgba(0, 255, 136, 0.08);
      border: 1px solid rgba(0, 255, 136, 0.2);
      padding: 6px 12px;
      border-radius: 20px;
    }

    .pulse-dot {
      width: 6px;
      height: 6px;
      background-color: #00ff88;
      border-radius: 50%;
      box-shadow: 0 0 8px #00ff88;
      animation: pulse 2s infinite;
    }

    @keyframes pulse {
      0% { transform: scale(1); opacity: 1; }
      50% { transform: scale(1.4); opacity: 0.5; }
      100% { transform: scale(1); opacity: 1; }
    }

    .version-badge {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 0.75rem;
      font-family: var(--font-mono);
      color: var(--text-muted);
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid var(--border-subtle);
      padding: 6px 12px;
      border-radius: 20px;
      text-decoration: none;
      transition: all 0.2s ease;
    }

    .version-badge:hover {
      color: var(--text);
      border-color: var(--border-hover);
      background: rgba(255, 255, 255, 0.08);
    }

    /* Centro: Relógio Zen e Busca */
    main {
      width: 100%;
      max-width: 900px;
      margin: auto;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 32px;
      padding: 40px 0;
    }

    .clock-container {
      text-align: center;
    }

    .clock {
      font-size: 5.8rem;
      font-weight: 700;
      letter-spacing: -0.04em;
      color: var(--text);
      line-height: 1;
      margin-bottom: 8px;
      text-shadow: 0 0 40px rgba(255, 255, 255, 0.12);
    }

    .date-text {
      font-size: 1.05rem;
      color: var(--text-muted);
      font-weight: 500;
      letter-spacing: -0.01em;
    }

    /* Busca */
    .search-container {
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
    }

    .search-engines {
      display: flex;
      gap: 6px;
      background: rgba(255, 255, 255, 0.03);
      padding: 4px;
      border-radius: 24px;
      border: 1px solid var(--border-subtle);
    }

    .engine-tab {
      background: transparent;
      border: none;
      color: var(--text-muted);
      font-size: 0.75rem;
      font-weight: 500;
      padding: 6px 14px;
      border-radius: 20px;
      cursor: pointer;
      transition: all 0.15s ease;
    }

    .engine-tab:hover {
      color: var(--text);
    }

    .engine-tab.active {
      background: #ffffff;
      color: #000000;
      font-weight: 600;
    }

    .search-bar {
      width: 100%;
      display: flex;
      align-items: center;
      background: rgba(20, 20, 20, 0.7);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid var(--border);
      border-radius: 36px;
      padding: 14px 22px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.6);
      transition: all 0.2s ease;
    }

    .search-bar:focus-within {
      border-color: rgba(255, 255, 255, 0.4);
      background: rgba(28, 28, 28, 0.9);
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.8), 0 0 20px rgba(255, 255, 255, 0.06);
    }

    .search-bar svg {
      width: 20px;
      height: 20px;
      color: var(--text-dim);
      margin-right: 14px;
      flex-shrink: 0;
    }

    .search-input {
      width: 100%;
      background: transparent;
      border: none;
      outline: none;
      color: var(--text);
      font-size: 1.05rem;
      font-family: inherit;
    }

    .search-input::placeholder {
      color: var(--text-dim);
    }

    /* Grade de Atalhos */
    .shortcuts-grid {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 14px;
      max-width: 800px;
    }

    .shortcut-card {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      background: rgba(18, 18, 18, 0.5);
      border: 1px solid var(--border-subtle);
      border-radius: 16px;
      padding: 14px 18px;
      text-decoration: none;
      color: var(--text);
      width: 88px;
      transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .shortcut-card:hover {
      background: rgba(30, 30, 30, 0.8);
      border-color: rgba(255, 255, 255, 0.2);
      transform: translateY(-3px);
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.4);
    }

    .shortcut-icon {
      width: 36px;
      height: 36px;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(255, 255, 255, 0.04);
    }

    .shortcut-icon svg {
      width: 20px;
      height: 20px;
    }

    .shortcut-title {
      font-size: 0.72rem;
      color: var(--text-muted);
      text-align: center;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      width: 100%;
    }

    .shortcut-card:hover .shortcut-title {
      color: var(--text);
    }

    /* Dock Inferior Flutuante (Figma #5153:260) */
    footer.floating-bottom-dock {
      width: min(1300px, calc(100vw - 48px));
      height: 64px;
      margin: 0 auto;
      background: var(--glass-bg);
      backdrop-filter: blur(28px);
      -webkit-backdrop-filter: blur(28px);
      border-radius: var(--dock-radius);
      border: 1px solid var(--glass-border);
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6), var(--glass-shadow);
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 28px;
      font-size: 0.78rem;
    }

    .footer-left {
      display: flex;
      gap: 16px;
    }

    .footer-badge {
      font-family: var(--font-mono);
      font-size: 0.72rem;
      color: var(--text-dim);
    }

    .footer-right a {
      color: var(--text-dim);
      text-decoration: none;
      transition: color 0.15s ease;
      font-size: 0.75rem;
    }

    .footer-right a:hover {
      color: var(--text);
    }
  </style>
</head>
<body>

  <!-- Zona Sensível de Borda Superior (Detecta Mouse) -->
  <div id="topHoverZone" class="top-hover-zone" title="Mova o mouse aqui para ver a barra superior"></div>
  <div id="topEdgeHint" class="top-edge-hint"></div>

  <!-- Barra Superior Flutuante (Revelada no Mouse Hover na borda) -->
  <header id="floatingTopBar" class="floating-top-bar">
    <a href="https://nave.ozati.co" target="_blank" class="brand">
      <svg viewBox="0 0 54 54" fill="none" xmlns="http://www.w3.org/2000/svg">

      </svg>
      <div>
        <span class="brand-title">Nave</span>

    <div style="display: flex; align-items: center; gap: 12px;">
      <a href="https://nave.ozati.co/#download" target="_blank" class="version-badge" title="Verificar atualizações do Nave">
        <span>v1.0.2</span>
        <span style="color: var(--text-dim);">•</span>

  </header>

  <!-- Centro Zen -->
  <main>
    <div class="clock-container">
      <div class="clock" id="clock">12:00</div>
      <div class="date-text" id="dateText">Sexta-feira, 18 de Setembro</div>
    </div>

    <!-- Barra de Pesquisa Google Nativa -->
    <div class="search-container">
      <div class="search-engines">
        <button class="engine-tab active" data-engine="google">Google</button>
        <button class="engine-tab" data-engine="brave">Brave</button>
        <button class="engine-tab" data-engine="ddg">DuckDuckGo</button>
        <button class="engine-tab" data-engine="startpage">Startpage</button>
      </div>

      <form id="searchForm" class="search-bar">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="11" cy="11" r="8"></circle>
          <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
        </svg>
        <input 
          type="text" 
          id="searchInput" 
          class="search-input" 
          placeholder="Pesquisar com Google ou digitar link..." 
          autocomplete="off" 
          autofocus
        >
      </form>
    </div>

    <!-- Grade de Atalhos -->
    <div class="shortcuts-grid" id="shortcutsGrid"></div>
  </main>

  <!-- Dock Inferior Flutuante -->
  <footer class="floating-bottom-dock">
    <div class="footer-left">
      <div class="footer-badge">Chromium Nativo</div>
      <div class="footer-badge">120 FPS GPU</div>
      <div class="footer-badge">Zero Telemetria</div>
    </div>
    <div class="footer-right" style="display: flex; gap: 16px; align-items: center;">
      <a href="https://nave.ozati.co/#download" target="_blank" style="display: flex; align-items: center; gap: 6px;">

        <span>Atualizações</span>
      </a>
      <a href="https://nave.ozati.co" target="_blank">nave.ozati.co</a>
    </div>
  </footer>

  <script>
    // 1. Controle da Barra Superior Flutuante (Aparece apenas na borda superior)
    const topBar = document.getElementById('floatingTopBar');
    const hoverZone = document.getElementById('topHoverZone');
    const edgeHint = document.getElementById('topEdgeHint');
    let hideTimeout = null;

    function showTopBar() {
      if (hideTimeout) clearTimeout(hideTimeout);
      topBar.classList.add('visible');
      edgeHint.style.opacity = '0';
    }

    function scheduleHideTopBar() {
      if (hideTimeout) clearTimeout(hideTimeout);
      hideTimeout = setTimeout(() => {
        topBar.classList.remove('visible');
        edgeHint.style.opacity = '1';
      }, 400);
    }

    // Hover na zona superior e na própria barra
    hoverZone.addEventListener('mouseenter', showTopBar);
    topBar.addEventListener('mouseenter', showTopBar);
    topBar.addEventListener('mouseleave', scheduleHideTopBar);
    hoverZone.addEventListener('mouseleave', (e) => {
      // Se não moveu diretamente para a barra
      if (e.clientY > 30 && !topBar.matches(':hover')) {
        scheduleHideTopBar();
      }
    });

    // Detecção contínua por proximidade do cursor (zero falhas)
    window.addEventListener('mousemove', (e) => {
      if (e.clientY <= 24) {
        showTopBar();
      } else if (e.clientY > 85 && !topBar.matches(':hover')) {
        topBar.classList.remove('visible');
        edgeHint.style.opacity = '1';
      }
    });

    // 2. Relógio e Data em Inter
    function updateClock() {
      const now = new Date();
      const h = String(now.getHours()).padStart(2, '0');
      const m = String(now.getMinutes()).padStart(2, '0');
      document.getElementById('clock').textContent = `${h}:${m}`;

      const options = { weekday: 'long', day: 'numeric', month: 'long' };
      const d = now.toLocaleDateString('pt-BR', options);
      document.getElementById('dateText').textContent = d.charAt(0).toUpperCase() + d.slice(1);
    }
    setInterval(updateClock, 1000);
    updateClock();

    // 3. Motores de Busca com Google como Padrão Oficial
    let currentEngine = localStorage.getItem('nave_engine') || 'google';
    const engines = {
      google: 'https://www.google.com/search?q=',
      brave: 'https://search.brave.com/search?q=',
      ddg: 'https://duckduckgo.com/?q=',
      startpage: 'https://www.startpage.com/sp/search?query='
    };

    const tabs = document.querySelectorAll('.engine-tab');
    tabs.forEach(tab => {
      if (tab.dataset.engine === currentEngine) {
        tabs.forEach(t => t.classList.remove('active'));
        tab.classList.add('active');
      }
      tab.addEventListener('click', () => {
        tabs.forEach(t => t.classList.remove('active'));
        tab.classList.add('active');
        currentEngine = tab.dataset.engine;
        localStorage.setItem('nave_engine', currentEngine);
        document.getElementById('searchInput').focus();
      });
    });

    // Submissão Rápida da Busca
    document.getElementById('searchForm').addEventListener('submit', (e) => {
      e.preventDefault();
      const val = document.getElementById('searchInput').value.trim();
      if (!val) return;

      if (val.startsWith('http://') || val.startsWith('https://')) {
        window.location.href = val;
      } else if (val.includes('.') && !val.includes(' ')) {
        window.location.href = 'https://' + val;
      } else {
        window.location.href = engines[currentEngine] + encodeURIComponent(val);
      }
    });

    // 4. Atalhos Rápidos com SVGs Nítidos
    const iconsMap = {
      google: `<svg viewBox="0 0 24 24"><path fill="#4285F4" d="M23.745 12.27c0-.7-.06-1.4-.19-2.07H12v4.51h6.6c-.29 1.52-1.14 2.8-2.4 3.65v3h3.88c2.27-2.09 3.66-5.17 3.66-9.09z"/><path fill="#34A853" d="M12 24c3.24 0 5.95-1.08 7.93-2.91l-3.88-3c-1.08.72-2.45 1.16-4.05 1.16-3.12 0-5.77-2.1-6.72-4.93H1.25v3.1C3.28 21.43 7.37 24 12 24z"/><path fill="#FBBC05" d="M5.28 14.32c-.25-.72-.38-1.49-.38-2.32s.13-1.6.38-2.32V6.58H1.25C.45 8.17 0 9.97 0 12s.45 3.83 1.25 5.42l4.03-3.1z"/><path fill="#EA4335" d="M12 4.75c1.77 0 3.35.61 4.6 1.8l3.42-3.42C17.95 1.19 15.24 0 12 0 7.37 0 3.28 2.57 1.25 6.58l4.03 3.1c.95-2.83 3.6-4.93 6.72-4.93z"/></svg>`,
      ozati: `<svg viewBox="0 0 54 54" fill="none"><path d="M40.1533 8.2312L46.4095 10.4925C45.8568 13.2563 45.0528 15.6181 43.9975 17.5779C42.9422 19.4875 41.6859 21.1458 40.2286 22.5528C38.8216 23.9096 37.2136 25.1156 35.4045 26.1709C33.6457 27.1759 31.7111 28.1558 29.6005 29.1106C27.0377 30.3166 24.7513 31.598 22.7412 32.9548C20.7814 34.3116 19.4085 35.1668 17.9009 37.1769C16.3934 39.1367 14.7261 42.5528 13.6206 45.7689L7.59045 43.3568C8.54523 40.392 9.70101 37.8543 11.0578 35.7438C12.4648 33.6332 13.9724 31.8493 15.5804 30.392C17.2387 28.9347 18.9472 27.6784 20.706 26.6232C22.4648 25.5679 24.1985 24.588 25.907 23.6835C27.7663 22.7287 29.4497 21.8242 30.9573 20.9699C32.5151 20.0654 33.8791 19.3294 35.0852 18.2742C36.3414 17.2189 37.3894 15.6684 38.1935 14.1106C39.0477 12.5528 39.701 10.593 40.1533 8.2312Z" fill="white"/></svg>`,
