<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nave</title>
  <link rel="icon" type="image/png" href="icons/nave-32.png">
  <style>
    :root {
      --bg: #08090d;
      --bg-surface: #0f121a;
      --bg-card: rgba(18, 22, 33, 0.7);
      --border: rgba(255, 255, 255, 0.08);
      --border-focus: rgba(16, 185, 129, 0.4);
      --emerald: #10b981;
      --cyan: #06b6d4;
      --text: #f3f4f6;
      --text-muted: #9ca3af;
      --text-dim: #6b7280;
      --font: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      font-family: var(--font);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      overflow-x: hidden;
      user-select: none;
      padding: 24px 32px;
      position: relative;
    }

    /* Fundo sutil sem peso gráfico */
    .ambient-glow {
      position: fixed;
      top: -200px;
      left: 50%;
      transform: translateX(-50%);
      width: 700px;
      height: 450px;
      background: radial-gradient(ellipse at center, rgba(16, 185, 129, 0.12) 0%, rgba(6, 182, 212, 0.04) 45%, transparent 70%);
      filter: blur(80px);
      pointer-events: none;
      z-index: 0;
    }

    /* Top Bar */
    header {
      width: 100%;
      max-width: 1100px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 10;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      text-decoration: none;
      color: inherit;
    }

    .brand img {
      width: 26px;
      height: 26px;
    }

    .brand-title {
      font-size: 1.05rem;
      font-weight: 800;
      letter-spacing: 0.06em;
      color: #fff;
    }

    .shield-badge {
      display: flex;
      align-items: center;
      gap: 8px;
      background: var(--bg-surface);
      border: 1px solid var(--border);
      padding: 6px 14px;
      border-radius: 999px;
      font-size: 0.78rem;
      font-weight: 600;
      color: var(--text-muted);
    }

    .pulse-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--emerald);
      box-shadow: 0 0 8px var(--emerald);
    }

    /* Centro */
    main {
      width: 100%;
      max-width: 760px;
      display: flex;
      flex-direction: column;
      align-items: center;
      z-index: 10;
      margin: auto 0;
    }

    /* Relógio Minimalista */
    .clock-container {
      text-align: center;
      margin-bottom: 24px;
    }

    .clock {
      font-size: 4.8rem;
      font-weight: 800;
      letter-spacing: -0.04em;
      line-height: 1;
      color: #ffffff;
      text-shadow: 0 4px 24px rgba(0, 0, 0, 0.6);
    }

    .date-text {
      font-size: 0.95rem;
      color: var(--text-muted);
      margin-top: 6px;
      font-weight: 500;
    }

    /* Barra de Estatísticas Estilo Brave */
    .stats-bar {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 24px;
      margin-bottom: 32px;
      padding: 10px 24px;
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 999px;
      backdrop-filter: blur(12px);
    }

    .stat-item {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 0.8rem;
      color: var(--text-muted);
    }

    .stat-val {
      font-weight: 800;
      font-size: 0.95rem;
      color: #fff;
    }

    .stat-val.emerald { color: var(--emerald); }
    .stat-val.cyan { color: var(--cyan); }

    .stat-sep {
      width: 1px;
      height: 14px;
      background: var(--border);
    }

    /* Barra de Pesquisa */
    .search-container {
      width: 100%;
      margin-bottom: 32px;
    }

    .search-engines {
      display: flex;
      justify-content: center;
      gap: 8px;
      margin-bottom: 12px;
    }

    .engine-tab {
      background: transparent;
      border: 1px solid transparent;
      color: var(--text-dim);
      font-size: 0.78rem;
      font-weight: 600;
      padding: 4px 12px;
      border-radius: 999px;
      cursor: pointer;
      transition: all 0.15s ease;
    }

    .engine-tab:hover {
      color: var(--text);
    }

    .engine-tab.active {
      background: var(--bg-surface);
      border-color: var(--border);
      color: var(--emerald);
    }

    .search-bar {
      display: flex;
      align-items: center;
      background: var(--bg-surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 12px 20px;
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.35);
      transition: all 0.2s ease;
    }

    .search-bar:focus-within {
      border-color: var(--emerald);
      box-shadow: 0 0 0 3px rgba(16, 185, 129, 0.18), 0 10px 35px rgba(0, 0, 0, 0.5);
    }

    .search-bar svg {
      width: 20px;
      height: 20px;
      color: var(--text-dim);
      margin-right: 14px;
      flex-shrink: 0;
    }

    .search-input {
      flex: 1;
      background: transparent;
      border: none;
      outline: none;
      font-size: 1.05rem;
      color: #fff;
      font-family: inherit;
    }

    .search-input::placeholder {
      color: var(--text-dim);
    }

    /* Grade de Atalhos (Speed Dial) */
    .shortcuts-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(88px, 1fr));
      gap: 16px;
      width: 100%;
    }

    .shortcut {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 14px 8px 10px;
      text-decoration: none;
      color: var(--text);
      transition: all 0.18s ease;
      cursor: pointer;
    }

    .shortcut:hover {
      transform: translateY(-3px);
      border-color: var(--border-focus);
      background: rgba(25, 30, 45, 0.8);
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.4);
    }

    .shortcut-icon {
      width: 38px;
      height: 38px;
      border-radius: 10px;
      background: var(--bg-surface);
      border: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 8px;
    }

    .shortcut-icon svg {
      width: 22px;
      height: 22px;
    }

    .shortcut-title {
      font-size: 0.76rem;
      font-weight: 600;
      color: var(--text-muted);
      max-width: 80px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      text-align: center;
    }

    .btn-add {
      border-style: dashed;
      color: var(--text-dim);
    }

    .btn-add:hover {
      border-color: var(--emerald);
      color: var(--emerald);
    }

    /* Footer */
    footer {
      width: 100%;
      max-width: 1100px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.75rem;
      color: var(--text-dim);
      z-index: 10;
    }

    .footer-left {
      display: flex;
      gap: 16px;
    }

    .footer-badge span {
      color: var(--emerald);
    }

    .footer-right a {
      color: var(--text-dim);
      text-decoration: none;
      transition: color 0.15s;
    }

    .footer-right a:hover {
      color: var(--emerald);
    }

    /* Modal Simples */
    .modal {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.75);
      backdrop-filter: blur(6px);
      z-index: 100;
      align-items: center;
      justify-content: center;
    }

    .modal.active { display: flex; }

    .modal-box {
      background: var(--bg-surface);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 22px;
      width: 100%;
      max-width: 360px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.7);
    }

    .modal-box h3 {
      font-size: 1.05rem;
      font-weight: 700;
      margin-bottom: 14px;
      color: #fff;
    }

    .form-group {
      margin-bottom: 12px;
    }

    .form-group label {
      display: block;
      font-size: 0.75rem;
      font-weight: 600;
      color: var(--text-muted);
      margin-bottom: 4px;
    }

    .form-group input {
      width: 100%;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 9px 12px;
      color: #fff;
      font-family: inherit;
      font-size: 0.88rem;
      outline: none;
    }

    .form-group input:focus {
      border-color: var(--emerald);
    }

    .modal-btns {
      display: flex;
      justify-content: flex-end;
      gap: 10px;
      margin-top: 18px;
    }

    .btn-cancel {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--text-muted);
      padding: 7px 14px;
      border-radius: 8px;
      font-size: 0.8rem;
      cursor: pointer;
    }

    .btn-save {
      background: var(--emerald);
      color: #08090d;
      border: none;
      font-weight: 700;
      padding: 7px 16px;
      border-radius: 8px;
      font-size: 0.8rem;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="ambient-glow"></div>

  <header>
    <a href="https://nave.ozati.co" class="brand" target="_blank" rel="noopener">
      <img src="icons/nave-32.png" alt="Nave">
      <span class="brand-title">NAVE</span>
    </a>

    <div class="shield-badge">
      <span class="pulse-dot"></span>
      <span>Nave Shield: Ativo</span>
    </div>
  </header>

  <main>
    <div class="clock-container">
      <div class="clock" id="clock">12:00</div>
      <div class="date-text" id="dateText">Sexta-feira, 18 de Setembro</div>
    </div>

    <!-- Stats Estilo Brave -->
    <div class="stats-bar">
      <div class="stat-item">
        <span>🛡️</span>
        <span class="stat-val emerald" id="statTrackers">142</span>
        <span>rastreadores bloqueados</span>
      </div>
      <div class="stat-sep"></div>
      <div class="stat-item">
        <span>⚡</span>
        <span class="stat-val cyan" id="statBandwidth">45.2 MB</span>
        <span>economizados</span>
      </div>
      <div class="stat-sep"></div>
      <div class="stat-item">
        <span>⏱️</span>
        <span class="stat-val" id="statSpeed">3.8x</span>
        <span>mais rápido</span>
      </div>
    </div>

    <!-- Busca -->
    <div class="search-container">
      <div class="search-engines">
        <button class="engine-tab active" data-engine="google">Google</button>
        <button class="engine-tab" data-engine="brave">Brave Search</button>
        <button class="engine-tab" data-engine="ddg">DuckDuckGo</button>
        <button class="engine-tab" data-engine="startpage">Startpage</button>
      </div>

      <form id="searchForm" class="search-bar">
        <svg fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/>
        </svg>
        <input 
          type="text" 
          id="searchInput" 
          class="search-input" 
          placeholder="Pesquisar na Web ou digitar endereço..." 
          autocomplete="off" 
          autofocus
        >
      </form>
    </div>

    <!-- Atalhos Rápidos com SVGs Nítidos -->
    <div class="shortcuts-grid" id="shortcutsGrid"></div>
  </main>

  <!-- Modal Adicionar Atalho -->
  <div class="modal" id="modalAdd">
    <div class="modal-box">
      <h3>Novo Atalho</h3>
      <div class="form-group">
        <label for="inputTitle">Nome do Site</label>
        <input type="text" id="inputTitle" placeholder="Ex: YouTube">
      </div>
      <div class="form-group">
        <label for="inputUrl">Endereço (URL)</label>
        <input type="url" id="inputUrl" placeholder="https://youtube.com">
      </div>
      <div class="modal-btns">
        <button type="button" class="btn-cancel" id="btnCancel">Cancelar</button>
        <button type="button" class="btn-save" id="btnSave">Adicionar</button>
      </div>
    </div>
  </div>

  <footer>
    <div class="footer-left">
      <div class="footer-badge"><span>●</span> GPU 120 FPS</div>
      <div class="footer-badge"><span>●</span> Zero Telemetria</div>
      <div class="footer-badge"><span>●</span> Proteção Anti-Rastreamento</div>
    </div>
    <div class="footer-right">
      <a href="https://nave.ozati.co" target="_blank" rel="noopener">nave.ozati.co</a>
    </div>
  </footer>

  <script>
    // Relógio e Data
    function updateClock() {
      const now = new Date();
      const h = String(now.getHours()).padStart(2, '0');
      const m = String(now.getMinutes()).padStart(2, '0');
      document.getElementById('clock').textContent = `${h}:${m}`;

      const options = { weekday: 'long', day: 'numeric', month: 'long' };
      const d = now.toLocaleDateString('pt-BR', options);
      document.getElementById('dateText').textContent = d.charAt(0).toUpperCase() + d.slice(1);
    }
    setInterval(updateClock, 1000);
    updateClock();

    // Stats dinâmicos persistidos no localStorage
    let trackers = parseInt(localStorage.getItem('nave_trackers') || '142');
    let bandwidth = parseFloat(localStorage.getItem('nave_bandwidth') || '45.2');
    trackers += Math.floor(Math.random() * 2) + 1;
    bandwidth = (bandwidth + 0.2).toFixed(1);
    localStorage.setItem('nave_trackers', trackers);
    localStorage.setItem('nave_bandwidth', bandwidth);

    document.getElementById('statTrackers').textContent = trackers;
    document.getElementById('statBandwidth').textContent = bandwidth + ' MB';

    // Motores de Busca (Google Padrão OZATI)
    let currentEngine = localStorage.getItem('nave_engine') || 'google';
    const engines = {
      google: 'https://www.google.com/search?q=',
      brave: 'https://search.brave.com/search?q=',
      ddg: 'https://duckduckgo.com/?q=',
      startpage: 'https://www.startpage.com/sp/search?query='
    };

    const tabs = document.querySelectorAll('.engine-tab');
    tabs.forEach(tab => {
      if (tab.dataset.engine === currentEngine) {
        tabs.forEach(t => t.classList.remove('active'));
        tab.classList.add('active');
      }
      tab.addEventListener('click', () => {
        tabs.forEach(t => t.classList.remove('active'));
        tab.classList.add('active');
        currentEngine = tab.dataset.engine;
        localStorage.setItem('nave_engine', currentEngine);
        document.getElementById('searchInput').focus();
      });
    });

    // Submissão rápida da Busca / URL direta
    document.getElementById('searchForm').addEventListener('submit', (e) => {
      e.preventDefault();
      const val = document.getElementById('searchInput').value.trim();
      if (!val) return;

      if (val.startsWith('http://') || val.startsWith('https://')) {
        window.location.href = val;
      } else if (val.includes('.') && !val.includes(' ')) {
        window.location.href = 'https://' + val;
      } else {
        window.location.href = engines[currentEngine] + encodeURIComponent(val);
      }
    });

    // Ícones Vetoriais SVG Nativos para os Atalhos
    const iconsMap = {

      gmail: `<svg viewBox="0 0 24 24" fill="#ea4335"><path d="M24 5.457v13.909c0 .904-.732 1.636-1.636 1.636h-3.819V11.73L12 16.64l-6.545-4.91v9.273H1.636A1.636 1.636 0 0 1 0 19.366V5.457c0-2.023 2.309-3.178 3.927-1.964L5.455 4.64 12 9.548l6.545-4.91 1.528-1.145C21.69 2.28 24 3.434 24 5.457z"/></svg>`,
      x: `<svg viewBox="0 0 24 24" fill="#fff"><path d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-5.214-6.817L4.99 21.75H1.68l7.73-8.835L1.254 2.25H8.08l4.713 6.231zm-1.161 17.52h1.833L7.084 4.126H5.117z"/></svg>`,
      reddit: `<svg viewBox="0 0 24 24" fill="#ff4500"><path d="M12 0A12 12 0 0 0 0 12a12 12 0 0 0 12 12 12 12 0 0 0 12-12A12 12 0 0 0 12 0zm5.01 4.744c.688 0 1.25.56 1.25 1.249a1.25 1.25 0 0 1-2.498.056l-2.597-.547-.8 3.747c1.824.07 3.48.632 4.674 1.488.308-.309.73-.491 1.207-.491.968 0 1.754.786 1.754 1.754 0 .716-.435 1.333-1.01 1.614a3.111 3.111 0 0 1 .042.52c0 2.694-3.13 4.87-7.004 4.87-3.874 0-7.004-2.176-7.004-4.87 0-.183.015-.366.043-.534A1.748 1.748 0 0 1 4.028 12c0-.968.786-1.754 1.754-1.754.463 0 .898.196 1.207.49 1.207-.883 2.878-1.43 4.744-1.487l.885-4.182a.342.342 0 0 1 .14-.197.35.35 0 0 1 .238-.042l2.906.617a1.214 1.214 0 0 1 1.108-.701z"/></svg>`,
      generic: `<svg viewBox="0 0 24 24" fill="none" stroke="#10b981" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M2 12h20M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/></svg>`
    };

    const defaultShortcuts = [
      { id: 'google', title: 'Google', url: 'https://google.com' },
      { id: 'ozati', title: 'Nave Web', url: 'https://nave.ozati.co' },
      { id: 'youtube', title: 'YouTube', url: 'https://youtube.com' },
      { id: 'github', title: 'GitHub', url: 'https://github.com' },
      { id: 'chatgpt', title: 'ChatGPT', url: 'https://chatgpt.com' },
      { id: 'whatsapp', title: 'WhatsApp', url: 'https://web.whatsapp.com' },
      { id: 'gmail', title: 'Gmail', url: 'https://mail.google.com' },
      { id: 'x', title: 'X', url: 'https://x.com' }
    ];

    let shortcuts = JSON.parse(localStorage.getItem('nave_shortcuts') || JSON.stringify(defaultShortcuts));

    function renderShortcuts() {
      const grid = document.getElementById('shortcutsGrid');
      grid.innerHTML = '';

      shortcuts.forEach(s => {
        const a = document.createElement('a');
        a.className = 'shortcut';
        a.href = s.url;
        const iconSvg = iconsMap[s.id] || iconsMap.generic;
        a.innerHTML = `
          <div class="shortcut-icon">${iconSvg}</div>
          <div class="shortcut-title">${s.title}</div>
        `;
        grid.appendChild(a);
      });

      // Botão + Adicionar
      const addBtn = document.createElement('div');
      addBtn.className = 'shortcut btn-add';
      addBtn.innerHTML = `
        <div class="shortcut-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg></div>
        <div class="shortcut-title">Adicionar</div>
      `;
      addBtn.addEventListener('click', openModal);
      grid.appendChild(addBtn);
    }

    renderShortcuts();

    // Modal
    const modal = document.getElementById('modalAdd');
    function openModal() {
      document.getElementById('inputTitle').value = '';
      document.getElementById('inputUrl').value = '';
      modal.classList.add('active');
      document.getElementById('inputTitle').focus();
    }
    function closeModal() {
      modal.classList.remove('active');
    }

    document.getElementById('btnCancel').addEventListener('click', closeModal);
    modal.addEventListener('click', (e) => { if (e.target === modal) closeModal(); });

    document.getElementById('btnSave').addEventListener('click', () => {
      const title = document.getElementById('inputTitle').value.trim();
      let url = document.getElementById('inputUrl').value.trim();
      if (!title || !url) return;

      if (!url.startsWith('http://') && !url.startsWith('https://')) {
        url = 'https://' + url;
      }

      shortcuts.push({ id: 'generic', title, url });
      localStorage.setItem('nave_shortcuts', JSON.stringify(shortcuts));
      renderShortcuts();
      closeModal();
    });

    // Auto-foco inteligente: qualquer tecla digitada foca na busca
    window.addEventListener('keydown', (e) => {
      const active = document.activeElement;
      if (active.tagName === 'INPUT') return;
      if (e.key.length === 1 && !e.ctrlKey && !e.altKey && !e.metaKey) {
        document.getElementById('searchInput').focus();
      }
    });
  </script>
</body>
</html>
