<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nave</title>
  <link rel="icon" type="image/png" href="icons/nave-32.png">
  
  <!-- Tipografia Oficial do App: Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg: #000000;
      --bg-surface: #0a0a0a;
      --bg-card: #111111;
      --border: #222222;
      --border-subtle: #181818;
      --border-hover: #444444;
      --text: #ffffff;
      --text-muted: #888888;
      --text-dim: #555555;
      --font-sans: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      --font-mono: 'JetBrains Mono', monospace;
    }

    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      font-family: var(--font-sans);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      user-select: none;
      padding: 24px 36px;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    /* Top Bar */
    header {
      width: 100%;
      max-width: 1200px;
      margin: 0 auto;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      text-decoration: none;
      color: inherit;
    }

    .brand svg {
      width: 26px;
      height: 26px;
    }

    .brand-title {
      font-size: 1rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      color: #fff;
    }

    .brand-sub {
      font-family: var(--font-mono);
      font-size: 0.72rem;
      color: var(--text-dim);
      text-transform: uppercase;
      letter-spacing: 0.08em;
    }

    .shield-badge {
      display: flex;
      align-items: center;
      gap: 8px;
      background: var(--bg-surface);
      border: 1px solid var(--border);
      padding: 6px 14px;
      border-radius: 4px;
      font-size: 0.75rem;
      font-weight: 500;
      color: var(--text-muted);
    }

    .version-badge {
      display: flex;
      align-items: center;
      gap: 6px;
      background: var(--bg-surface);
      border: 1px solid var(--border);
      padding: 6px 12px;
      border-radius: 4px;
      font-size: 0.72rem;
      font-family: var(--font-mono);
      color: var(--text-muted);
      text-decoration: none;
      transition: all 0.15s ease;
    }

    .version-badge:hover {
      border-color: #ffffff;
      color: #ffffff;
    }

    .pulse-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #ffffff;
    }

    /* Centro */
    main {
      width: 100%;
      max-width: 780px;
      margin: auto;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
    }

    /* Relógio em Inter */
    .clock-container {
      margin-bottom: 24px;
    }

    .clock {
      font-size: 5rem;
      font-weight: 700;
      letter-spacing: -0.04em;
      line-height: 1;
      color: #ffffff;
    }

    .date-text {
      font-size: 0.95rem;
      color: var(--text-muted);
      margin-top: 8px;
      font-weight: 400;
      letter-spacing: -0.01em;
    }

    /* Barra de Pesquisa */
    .search-container {
      width: 100%;
      margin-bottom: 36px;
    }

    .search-engines {
      display: flex;
      justify-content: center;
      gap: 6px;
      margin-bottom: 12px;
    }

    .engine-tab {
      background: transparent;
      border: 1px solid transparent;
      color: var(--text-dim);
      font-size: 0.76rem;
      font-weight: 500;
      padding: 4px 12px;
      border-radius: 4px;
      cursor: pointer;
      transition: all 0.15s ease;
      font-family: inherit;
    }

    .engine-tab:hover {
      color: var(--text);
    }

    .engine-tab.active {
      background: var(--bg-surface);
      border-color: var(--border);
      color: #ffffff;
      font-weight: 600;
    }

    .search-bar {
      display: flex;
      align-items: center;
      background: var(--bg-surface);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 12px 18px;
      transition: border-color 0.2s ease;
    }

    .search-bar:focus-within {
      border-color: #666666;
    }

    .search-bar svg {
      width: 18px;
      height: 18px;
      color: var(--text-dim);
      margin-right: 12px;
      flex-shrink: 0;
    }

    .search-input {
      flex: 1;
      background: transparent;
      border: none;
      outline: none;
      font-size: 0.98rem;
      color: #fff;
      font-family: inherit;
    }

    .search-input::placeholder {
      color: var(--text-dim);
    }

    /* Grade de Atalhos */
    .shortcuts-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(84px, 1fr));
      gap: 12px;
      width: 100%;
    }

    .shortcut {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: var(--bg-surface);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 12px 6px 10px;
      text-decoration: none;
      color: var(--text);
      transition: all 0.15s ease;
      cursor: pointer;
    }

    .shortcut:hover {
      border-color: var(--border-hover);
      background: #141414;
      transform: translateY(-1px);
    }

    .shortcut-icon {
      width: 32px;
      height: 32px;
      border-radius: 4px;
      background: #111;
      border: 1px solid var(--border-subtle);
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 8px;
    }

    .shortcut-icon svg {
      width: 18px;
      height: 18px;
    }

    .shortcut-title {
      font-size: 0.72rem;
      font-weight: 500;
      color: var(--text-muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 72px;
    }

    /* Footer */
    footer {
      width: 100%;
      max-width: 1200px;
      margin: 0 auto;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.75rem;
      color: var(--text-dim);
      border-top: 1px solid var(--border-subtle);
      padding-top: 16px;
    }

    .footer-left {
      display: flex;
      gap: 16px;
    }

    .footer-badge {
      font-family: var(--font-mono);
    }

    .footer-right a {
      color: var(--text-dim);
      text-decoration: none;
      transition: color 0.15s ease;
    }

    .footer-right a:hover {
      color: var(--text);
    }
  </style>
</head>
<body>

  <!-- Top Bar -->
  <header>
    <a href="https://nave.ozati.co" target="_blank" class="brand">
      <svg viewBox="0 0 100 100" fill="none">
        <circle cx="50" cy="50" r="38" stroke="#ffffff" stroke-width="12" />
      </svg>
      <div>
        <span class="brand-title">ozati™</span>
        <span class="brand-sub">/ nave</span>
      </div>
    </a>

    <div style="display: flex; align-items: center; gap: 10px;">
      <a href="https://nave.ozati.co/#download" target="_blank" class="version-badge" title="Verificar atualizações do Nave">
        <span>v1.0.0</span>
        <span style="color: var(--text-dim);">•</span>
        <span>Atualizar</span>
      </a>
      <div class="shield-badge">
        <span class="pulse-dot"></span>
        <span>Nave Shield Ativo</span>
      </div>
    </div>
  </header>

  <!-- Centro -->
  <main>
    <div class="clock-container">
      <div class="clock" id="clock">12:00</div>
      <div class="date-text" id="dateText">Sexta-feira, 18 de Setembro</div>
    </div>

    <!-- Barra de Pesquisa Google Nativa -->
    <div class="search-container">
      <div class="search-engines">
        <button class="engine-tab active" data-engine="google">Google</button>
        <button class="engine-tab" data-engine="brave">Brave</button>
        <button class="engine-tab" data-engine="ddg">DuckDuckGo</button>
        <button class="engine-tab" data-engine="startpage">Startpage</button>
      </div>

      <form id="searchForm" class="search-bar">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="11" cy="11" r="8"></circle>
          <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
        </svg>
        <input 
          type="text" 
          id="searchInput" 
          class="search-input" 
          placeholder="Pesquisar com Google ou digitar link..." 
          autocomplete="off" 
          autofocus
        >
      </form>
    </div>

    <!-- Grade de Atalhos -->
    <div class="shortcuts-grid" id="shortcutsGrid"></div>
  </main>

  <!-- Footer -->
  <footer>
    <div class="footer-left">
      <div class="footer-badge">Chromium 151 Nativo</div>
      <div class="footer-badge">120 FPS GPU</div>
      <div class="footer-badge">Zero Telemetria</div>
    </div>
    <div class="footer-right" style="display: flex; gap: 16px; align-items: center;">
      <a href="https://nave.ozati.co/#download" target="_blank" style="display: flex; align-items: center; gap: 6px;">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
        <span>Atualizações</span>
      </a>
      <a href="https://nave.ozati.co" target="_blank">nave.ozati.co</a>
    </div>
  </footer>

  <script>
    // Relógio e Data em Inter
    function updateClock() {
      const now = new Date();
      const h = String(now.getHours()).padStart(2, '0');
      const m = String(now.getMinutes()).padStart(2, '0');
      document.getElementById('clock').textContent = `${h}:${m}`;

      const options = { weekday: 'long', day: 'numeric', month: 'long' };
      const d = now.toLocaleDateString('pt-BR', options);
      document.getElementById('dateText').textContent = d.charAt(0).toUpperCase() + d.slice(1);
    }
    setInterval(updateClock, 1000);
    updateClock();

    // Motores de Busca com Google como Padrão Oficial
    let currentEngine = localStorage.getItem('nave_engine') || 'google';
    const engines = {
      google: 'https://www.google.com/search?q=',
      brave: 'https://search.brave.com/search?q=',
      ddg: 'https://duckduckgo.com/?q=',
      startpage: 'https://www.startpage.com/sp/search?query='
    };

    const tabs = document.querySelectorAll('.engine-tab');
    tabs.forEach(tab => {
      if (tab.dataset.engine === currentEngine) {
        tabs.forEach(t => t.classList.remove('active'));
        tab.classList.add('active');
      }
      tab.addEventListener('click', () => {
        tabs.forEach(t => t.classList.remove('active'));
        tab.classList.add('active');
        currentEngine = tab.dataset.engine;
        localStorage.setItem('nave_engine', currentEngine);
        document.getElementById('searchInput').focus();
      });
    });

    // Submissão Rápida da Busca
    document.getElementById('searchForm').addEventListener('submit', (e) => {
      e.preventDefault();
      const val = document.getElementById('searchInput').value.trim();
      if (!val) return;

      if (val.startsWith('http://') || val.startsWith('https://')) {
        window.location.href = val;
      } else if (val.includes('.') && !val.includes(' ')) {
        window.location.href = 'https://' + val;
      } else {
        window.location.href = engines[currentEngine] + encodeURIComponent(val);
      }
    });

    // Atalhos Rápidos com SVGs Nítidos
    const iconsMap = {
      google: `<svg viewBox="0 0 24 24"><path fill="#4285F4" d="M23.745 12.27c0-.7-.06-1.4-.19-2.07H12v4.51h6.6c-.29 1.52-1.14 2.8-2.4 3.65v3h3.88c2.27-2.09 3.66-5.17 3.66-9.09z"/><path fill="#34A853" d="M12 24c3.24 0 5.95-1.08 7.93-2.91l-3.88-3c-1.08.72-2.45 1.16-4.05 1.16-3.12 0-5.77-2.1-6.72-4.93H1.25v3.1C3.28 21.43 7.37 24 12 24z"/><path fill="#FBBC05" d="M5.28 14.32c-.25-.72-.38-1.49-.38-2.32s.13-1.6.38-2.32V6.58H1.25C.45 8.17 0 9.97 0 12s.45 3.83 1.25 5.42l4.03-3.1z"/><path fill="#EA4335" d="M12 4.75c1.77 0 3.35.61 4.6 1.8l3.42-3.42C17.95 1.19 15.24 0 12 0 7.37 0 3.28 2.57 1.25 6.58l4.03 3.1c.95-2.83 3.6-4.93 6.72-4.93z"/></svg>`,
      ozati: `<svg viewBox="0 0 100 100" fill="none"><circle cx="50" cy="50" r="38" stroke="#ffffff" stroke-width="12"/></svg>`,
      youtube: `<svg viewBox="0 0 24 24" fill="#ff0000"><path d="M23.498 6.186a3.016 3.016 0 0 0-2.122-2.136C19.505 3.545 12 3.545 12 3.545s-7.505 0-9.377.505A3.017 3.017 0 0 0 .502 6.186C0 8.07 0 12 0 12s0 3.93.502 5.814a3.016 3.016 0 0 0 2.122 2.136c1.871.505 9.376.505 9.376.505s7.505 0 9.377-.505a3.015 3.015 0 0 0 2.122-2.136C24 15.93 24 12 24 12s0-3.93-.502-5.814zM9.545 15.568V8.432L15.818 12l-6.273 3.568z"/></svg>`,
      github: `<svg viewBox="0 0 24 24" fill="#fff"><path d="M12 0C5.37 0 0 5.37 0 12c0 5.31 3.435 9.795 8.205 11.385.6.105.825-.255.825-.57 0-.285-.015-1.23-.015-2.235-3.015.555-3.795-.735-4.035-1.41-.135-.345-.72-1.41-1.23-1.695-.42-.225-1.02-.78-.015-.795.945-.015 1.62.87 1.845 1.23 1.08 1.815 2.805 1.305 3.495.99.105-.78.42-1.305.765-1.605-2.67-.3-5.46-1.335-5.46-5.925 0-1.305.465-2.385 1.23-3.225-.12-.3-.54-1.53.12-3.18 0 0 1.005-.315 3.3 1.23.96-.27 1.98-.405 3-.405s2.04.135 3 .405c2.295-1.56 3.3-1.23 3.3-1.23.66 1.65.24 2.88.12 3.18.765.84 1.23 1.905 1.23 3.225 0 4.605-2.805 5.625-5.475 5.925.435.375.81 1.095.81 2.22 0 1.605-.015 2.895-.015 3.3 0 .315.225.69.825.57A12.02 12.02 0 0024 12c0-6.63-5.37-12-12-12z"/></svg>`,
      chatgpt: `<svg viewBox="0 0 24 24" fill="#fff"><path d="M22.28 9.9a5.98 5.98 0 0 0-.48-4.68 6.04 6.04 0 0 0-6.62-2.73A6 6 0 0 0 10.4 1a6.04 6.04 0 0 0-5.74 4.19 6 6 0 0 0-4.14 3 6.04 6.04 0 0 0 .74 7.15 5.98 5.98 0 0 0 .48 4.68 6.04 6.04 0 0 0 6.62 2.73A6 6 0 0 0 13.6 23a6.04 6.04 0 0 0 5.74-4.19 6 6 0 0 0 4.14-3 6.04 6.04 0 0 0-.74-7.15z"/></svg>`,
      whatsapp: `<svg viewBox="0 0 24 24" fill="#25d366"><path d="M12.04 2c-5.46 0-9.91 4.45-9.91 9.91 0 1.75.46 3.45 1.32 4.95L2.05 22l5.25-1.38c1.45.79 3.08 1.21 4.74 1.21 5.46 0 9.91-4.45 9.91-9.91 0-2.65-1.03-5.14-2.9-7.01A9.816 9.816 0 0 0 12.04 2z"/></svg>`,
      gmail: `<svg viewBox="0 0 24 24" fill="#ea4335"><path d="M24 5.457v13.909c0 .904-.732 1.636-1.636 1.636h-3.819V11.73L12 16.64l-6.545-4.91v9.273H1.636A1.636 1.636 0 0 1 0 19.366V5.457c0-2.023 2.309-3.178 3.927-1.964L5.455 4.64 12 9.548l6.545-4.91 1.528-1.145C21.69 2.28 24 3.434 24 5.457z"/></svg>`,
      x: `<svg viewBox="0 0 24 24" fill="#fff"><path d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-5.214-6.817L4.99 21.75H1.68l7.73-8.835L1.254 2.25H8.08l4.713 6.231zm-1.161 17.52h1.833L7.084 4.126H5.117z"/></svg>`
    };

    const shortcuts = [
      { id: 'google', title: 'Google', url: 'https://google.com' },
      { id: 'ozati', title: 'OZATI Hub', url: 'https://nave.ozati.co' },
      { id: 'youtube', title: 'YouTube', url: 'https://youtube.com' },
      { id: 'github', title: 'GitHub', url: 'https://github.com' },
      { id: 'chatgpt', title: 'ChatGPT', url: 'https://chatgpt.com' },
      { id: 'whatsapp', title: 'WhatsApp', url: 'https://web.whatsapp.com' },
      { id: 'gmail', title: 'Gmail', url: 'https://mail.google.com' },
      { id: 'x', title: 'X', url: 'https://x.com' }
    ];

    const grid = document.getElementById('shortcutsGrid');
    shortcuts.forEach(s => {
      const a = document.createElement('a');
      a.className = 'shortcut';
      a.href = s.url;
      a.innerHTML = `
        <div class="shortcut-icon">${iconsMap[s.id]}</div>
        <div class="shortcut-title">${s.title}</div>
      `;
      grid.appendChild(a);
    });

    // Auto-focus no input
    window.addEventListener('keydown', (e) => {
      const active = document.activeElement;
      if (active.tagName === 'INPUT') return;
      if (e.key.length === 1 && !e.ctrlKey && !e.altKey && !e.metaKey) {
        document.getElementById('searchInput').focus();
      }
    });
  </script>
</body>
</html>
